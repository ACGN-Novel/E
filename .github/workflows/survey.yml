name: Survey

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pypinyin
      - name: Run survey
        env:
          SITES: "https://novel.transchinese.org,https://xnovel.transchinese.org,https://unovel.transchinese.org"
        run: python3 scripts/survey.py
      - name: Commit survey result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _survey.json
          if git diff --staged --quiet; then echo "无变化"; else git commit -m "chore: 临时摸底统计"; git push; fi
